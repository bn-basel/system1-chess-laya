[project]
name = "system1-chess-laya"
version = "0.1.0"
description = "Can a small System-1 decision model play chess? Benchmarking Laya against Stockfish."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya>=0.3.22",
    "torch>=2.7",
    "chess>=1.11",
    "numpy>=1.26",
    "zstandard>=0.25.0",
    "tqdm>=4.70.1",
    "matplotlib>=3.11.2",
]

# RTX 50-series (Blackwell) GPUs need a PyTorch build against CUDA 12.8 or newer;
# the default PyPI wheel on Windows is CPU-only, so torch comes from PyTorch's own index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laya_chess"]

[tool.ruff]
line-length = 120
